  title: Scilents API V1
  version: v1
paths:
  "/api/v1/search_articles":
    get:
      summary: Fetch scientific articles with AI summary
      tags:
      - Articles
      parameters:
      - name: query
        in: query
        required: true
        description: the topic or research area of the articles you want to retrieve
        examples:
          success response:
            value: breast cancer
        schema:
          type: string
      responses:
        '200':
          description: success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  articles:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        abstract:
                          type: string
                        authors:
                          type: array
                          items:
                            type: object
                            properties:
                              full_name:
                                type: string
                              last_name:
                                type: string
                              fore_name:
                                type: string
                              initials:
                                type: string
                              affiliations:
                                type: array
                                items:
                                  type: string
                        pmid:
                          type: string
                        doi:
                          type: string
                        url:
                          type: string
                        summary:
                          type: object
                          properties:
                            objective:
                              type: string
                            methodology:
                              type: string
                            key_results:
                              type: string
                            conclusion:
                              type: string
              examples:
                success:
                  summary: Successful response
                  value:
                    articles:
                    - title: 'Breast cancer: Biology, biomarkers, and treatments.'
                      abstract: During the past recent years, various therapies emerged
                        in the era of breast cancer. Breast cancer is a heterogeneous
                        disease in which genetic and environmental factors are involved.
                        Breast cancer stem cells (BCSCs) are the main player in the
                        aggressiveness of different tumors and also, these cells are
                        the main challenge in cancer treatment. Moreover, the major
                        obstacle to achieve an effective treatment is resistance to
                        therapies. There are various types of treatment for breast
                        cancer (BC) patients. Therefore, in this review, we present
                        the current treatments, novel approaches such as antibody-drug
                        conjugation systems (ADCs), nanoparticles (albumin-, metal-,
                        lipid-, polymer-, micelle-based nanoparticles), and BCSCs-based
                        therapies. Furthermore, prognostic and predictive biomarkers
                        will be discussed also biomarkers that have been applied by
                        some tests such as Oncotype DX, Mamm αPrint, and uPA/PAI-1
                        are regarded as suitable prognostic and predictive factors
                        in breast cancer.
