                    - title: 'Breast cancer: presentation, investigation and management.'
                      abstract: Breast cancer is the most common global malignancy
                        and the leading cause of cancer deaths. Despite this, undergraduate
                        and postgraduate exposure to breast cancer is limited, impacting
                        on the ability of clinicians to accurately recognise, assess
                        and refer appropriate patients. This article provides a comprehensive
                        review of the pathology, epidemiology, clinical presentation,
                        referral pathways and management of breast cancer in the UK.
